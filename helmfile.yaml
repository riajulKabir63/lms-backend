repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: my-lms-stack
    namespace: default
    chart: ./lms-app
    values:
      - backend:
          env:
            SPRING_DATASOURCE_URL: "jdbc:postgresql://lms-database-postgresql:5432/lms_db"
            SPRING_DATASOURCE_USERNAME: "postgres"
            SPRING_DATASOURCE_PASSWORD: "postgres"

  - name: lms-database
    namespace: default
    chart: bitnami/postgresql
    values:
      - auth:
          postgresPassword: "postgres"
          database: "lms_db"